name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LidFlip.exe
        shell: cmd
        run: build.cmd

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash LidFlip.exe -Algorithm SHA256).Hash.ToLower() + "  LidFlip.exe" | Out-File -Encoding ascii LidFlip.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LidFlip
          path: |
            LidFlip.exe
            LidFlip.exe.sha256

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "LidFlip $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" LidFlip.exe LidFlip.exe.sha256 --clobber
